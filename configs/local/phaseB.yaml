# VERSION LOCALE (GPU NVIDIA T600, 4 Go) : chemins relatifs, lots plus petits.
# Lancer depuis la racine du dépôt : python train.py --config configs/local/phaseB.yaml

# Phase B : le GRAND modèle (122M) apprend tout : grammaire + textes réels.
# Avant : python grow.py --source .../phaseA/finale --sortie .../grand_init --hidden 768 --layers 12 --heads 12
# Durée indicative : 6 à 10 heures sur un T4 (Colab coupe : le script reprend tout seul).

mode: pretrain
modele: A_METTRE_DANS_DRIVE/modele/grand_init
tokenizer: A_METTRE_DANS_DRIVE/modele/grand_init
reinitialiser_embeddings: false
dossier_sortie: A_METTRE_DANS_DRIVE/modele/phaseB
gradient_checkpointing: true      # économise la mémoire du GPU

sources:
  # Grammaire (on la garde pour ne pas l'oublier)
  - fichiers: A_METTRE_DANS_DRIVE/donnees/conjugaison_fr/*.txt
    repeter: 1
  - fichiers: A_METTRE_DANS_DRIVE/donnees/conjugaison_rn/*.txt
    repeter: 1
  - fichiers: A_METTRE_DANS_DRIVE/donnees/grammaire_rn/*.txt
    repeter: 2
  - fichiers: A_METTRE_DANS_DRIVE/donnees/lexique_rn/*.txt
    repeter: 3
  # Phrases réelles, traduites par des experts
  - fichiers: A_METTRE_DANS_DRIVE/donnees/cours/*.txt
    repeter: 4
  - fichiers: A_METTRE_DANS_DRIVE/donnees/fsi_rn/fsi_rn.txt
    repeter: 2
  # Bible : seulement la part de 25 % (passages bilingues)
  - fichiers: A_METTRE_DANS_DRIVE/donnees/bible/bible_bilingue_25.txt
    repeter: 2

longueur: 512
taille_lot: 4                     # Colab : 16 (4 Go de VRAM ici)
accumulation: 32                  # lot effectif identique : 4 x 32 = 128
epoques: 3
learning_rate: 3.0e-4
weight_decay: 0.1
warmup: 2000                      # doux : le modèle vient d'être agrandi

log_tous_les: 50
eval_tous_les: 1000
sauver_tous_les: 1000

phrases_test:
  - "Kirundi : Umwana arakora cane.\nFrançais :"
  - "Français : Je reste à la maison parce que je suis malade.\nKirundi :"
  - "Urabona igitabo? Ego,"
  - "Abana batiga"
