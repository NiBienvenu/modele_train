# Modèle TROIS, étape 2 : DISCUTER, à partir de la lecture du trois.
# Changements par rapport au deux (sans travail spécial sur les données) :
#  - petites sources plus souvent (elles étaient noyées) : petite_conversation x30, salutations x50
#  - FLORES dev x5 (deux : x2), Bible corrigée (16 000 passages, moitié vers le français)
#  - insiguro de Dusome 4 ; 5 époques (~2,5 h) : la loss baissait encore à la fin du deux,
#    et garder_meilleure protège si ça commence à apprendre par cœur.

mode: sft
modele: "{TRAVAIL}/lecture/finale"
tokenizer: "{TRAVAIL}/lecture/finale"
dossier_sortie: "{TRAVAIL}/chat"

sources:
  # --- Parler (zéro) ---
  - fichiers: "{DATASET}/dialogues/salutations_rn.jsonl"
    repeter: 50
  - fichiers: "{DATASET}/dialogues/questions_sur_rn.jsonl"
    repeter: 30
  - fichiers: "{DATASET}/dialogues/petite_conversation.jsonl"
    repeter: 30
  - fichiers: "{DATASET}/dialogues/conversations_rn.jsonl"
    repeter: 5
  # --- Correction 2 : Bible : 16 000 passages choisis sur 40 538, moitié vers le français, longueur comme les tests ---
  - fichiers: "{DATASET_DEUX}/traduction/bible_choisie.jsonl"
    repeter: 1
  # --- Correction 3 : réponses courtes et précises, beaucoup plus souvent ---
  - fichiers: "{DATASET}/dialogues/traductions_cours.jsonl"
    repeter: 15         # un : 3
  - fichiers: "{DATASET}/dialogues/vocabulaire.jsonl"
    repeter: 9          # un : 2
  - fichiers: "{DATASET}/dialogues/titres_kirnews.jsonl"
    repeter: 2
  - fichiers: "{DATASET}/dialogues/anciennes_qr.jsonl"
    repeter: 1
  - fichiers: "{DATASET_UN}/dialogues/insiguro.jsonl"
    repeter: 4
  # --- Correction 4 : traductions hors Bible ---
  - fichiers: "{DATASET_DEUX}/traduction/flores_dev.jsonl"    # FLORES dev (devtest = tests seulement)
    repeter: 5
  - fichiers: "{DATASET_DEUX}/traduction/fr_rn.jsonl"         # constitution 2018 + loi presse 2024
    repeter: 2
  # --- Nouveau : docs 3 ---
  - fichiers: "{DATASET_DEUX}/constitutions/memoire_2005.jsonl"   # par cœur
    repeter: 3
  - fichiers: "{DATASET_DEUX}/constitutions/memoire_2018.jsonl"
    repeter: 3
  - fichiers: "{DATASET_DEUX}/ikibonezamvugo/ikibonezamvugo_qa.jsonl"  # grammaire
    repeter: 6
  - fichiers: "{DATASET_DEUX}/insiguro/dusome5_insiguro.jsonl"
    repeter: 5
  - fichiers: "{DATASET_TROIS}/insiguro/dusome4_insiguro.jsonl"   # nouveau
    repeter: 5
  # --- Correction 7 ---
  - fichiers: "{DATASET_DEUX}/faits/faits_burundi.jsonl"
    repeter: 40
  # --- Données publiques (sautées si absentes) ---
  - fichiers: "{PUBLICS}/dialogues/oasst_fr.jsonl"
    repeter: 5
  - fichiers: "{PUBLICS}/dialogues/aya.jsonl"
    repeter: 2
  - fichiers: "{PUBLICS}/dialogues/piaf.jsonl"
    repeter: 1

longueur: 1024
taille_lot: 8
accumulation: 4
epoques: 5
learning_rate: 1.0e-4
weight_decay: 0.05     # correction 5 (un : 0)
dropout: 0.1           # correction 5
garder_meilleure: true # correction 5 : finale = le meilleur point si la fin est moins bonne
warmup: 200
part_eval: 0.02

log_tous_les: 50
eval_tous_les: 1000
sauver_tous_les: 1000
sauver_toutes_les_heures: 4
marge_minutes: 25
penalite_repetition: 1.0   # run deux : 1.2 casse les conjugaisons
sans_repeter_ngram: 0

phrases_test:
  - "<|user|> Bonjour <|assistant|>"
  - "<|user|> Bwakeye. <|assistant|>"
  - "<|user|> Où se trouve le Burundi ? <|assistant|>"
  - "<|user|> Traduis en français : Umwana n'umukobwa. <|assistant|>"
  - "<|user|> Ingingo ya 5 y'Ibwirizwa shingiro rya 2018 ivuga iki? <|assistant|>"
  - "<|user|> Que signifie « karangura » en grammaire kirundi ? <|assistant|>"
