# Modèle TROIS, étape 1 : LECTURE (on CONTINUE la lecture du modèle deux : même tokenizer).
# Session Kaggle de 12 h : ~6 h de lecture (4 500 pas à ~4,6 s/pas sur 2 x T4).
# Run deux : la loss ne baissait presque plus après ~1 400 pas, parce que les mêmes textes revenaient.
# Ici : plus de Wikipédia FR (001 à 004) et chaque texte kirundi une seule fois par époque,
# pour que le modèle ne récite pas les mêmes pages 20 fois. Learning rate plus bas (on continue).
#
# {DEUX}  = dossier du modèle deux (contient lecture/finale)
# {DATASET} = zéro  {DATASET_UN} = un  {DATASET_DEUX} = deux  {DATASET_TROIS} = trois  {TRAVAIL} = modele_trois

mode: pretrain
modele: "{DEUX}/lecture/finale"
tokenizer: "{DEUX}/lecture/finale"
dossier_sortie: "{TRAVAIL}/lecture"

sources:
  # --- Français : 4 fichiers Wikipédia (2 nouveaux) ---
  - fichiers: "{PUBLICS}/lecture_fr/wikipedia_fr_00[1-4].txt"
    repeter: 1
  # --- Kirundi du zéro ---
  - fichiers: "{DATASET}/lecture_rn/bible_rn.txt"
    repeter: 1
  - fichiers: "{DATASET}/lecture_rn/[!b]*.txt"
    repeter: 1
  - fichiers: "{DATASET}/lecture_bilingue/*.txt"
    repeter: 1
  - fichiers: "{DATASET}/grammaire/*.txt"
    repeter: 1
  # --- Modèle un ---
  - fichiers: "{DATASET_UN}/lecture_rn/docs_scannes.txt"
    repeter: 1
  - fichiers: "{DATASET_UN}/lecture_rn/textes_messe.txt"
    repeter: 1
  - fichiers: "{DATASET_UN}/insiguro/*.txt"
    repeter: 2
  # --- Modèle deux ---
  - fichiers: "{DATASET_DEUX}/lecture_rn/*.txt"
    repeter: 1
  - fichiers: "{DATASET_DEUX}/constitutions/*.txt"
    repeter: 2
  - fichiers: "{DATASET_DEUX}/ikibonezamvugo/indimburo_yikirundi.txt"
    repeter: 2
  - fichiers: "{DATASET_DEUX}/faits/faits_burundi.txt"
    repeter: 5
  # --- Nouveau : Dusome 4 ---
  - fichiers: "{DATASET_TROIS}/lecture_rn/*.txt"
    repeter: 2
  - fichiers: "{DATASET_TROIS}/insiguro/*.txt"
    repeter: 2

longueur: 1024
taille_lot: 8
accumulation: 16
epoques: 1
min_pas: 4500          # ~6 h : le temps de session est le but, pas le nombre d'époques
learning_rate: 2.0e-4  # deux : 3e-4 depuis le un ; ici on continue un modèle déjà bien lu
weight_decay: 0.1
warmup: 100
part_eval: 0.01
garder_meilleure: true # si la fin est moins bonne (trop de répétitions), on garde le meilleur point

log_tous_les: 25
eval_tous_les: 250
sauver_tous_les: 50
sauver_toutes_les_heures: 4
marge_minutes: 25
penalite_repetition: 1.0
sans_repeter_ngram: 0

phrases_test:
  - "Abana baragiye"
  - "Uburundi ni igihugu"
  - "Le Burundi est un pays"
  - "Ururimi rw'igihugu ni"
  - "Ingingo ya 5\n"
  - "Umwigisha yabwiye abanyeshure"
